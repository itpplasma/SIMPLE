<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 546" width="980" height="546" role="img" aria-labelledby="title desc">
<title id="title">SIMPLE workflow</title>
<desc id="desc">Field sources (VMEC, GVEC and booz_xform via Boozer chartmap converters, coils, SPECTRE) feed a splined field representation, canonical coordinates, guiding-centre integration on CPU or Boozer RK on GPU, full-orbit integration on CPU, and outputs (confined fraction, loss times, orbit classes, wall hits) that pysimple post-processes and exposes to external optimisers.</desc>
<style>text{font-family:'DejaVu Sans',Helvetica,Arial,sans-serif}.label{fill:#333333}.note{fill:#555555;font-style:italic}.arrow{stroke:#7F7F7F}#head path{fill:#7F7F7F}@media (prefers-color-scheme: dark){.label{fill:#E6E6E6}.note{fill:#BDBDBD}.arrow{stroke:#A6A6A6}#head path{fill:#A6A6A6}}</style>
