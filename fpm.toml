name = "SIMPLE"
version = "1.5.1"
license = "MIT"
author = "Christopher Albert"
maintainer = "albert@tugraz.at"
copyright = "Copyright 2025, Plasma Physics at TU Graz"

[dependencies]
libneo.git = "https://github.com/itpplasma/libneo.git"
# libneo and fortarray pin different fortio commits; use libneo's.
fortio = { git = "https://github.com/lazy-fortran/fortio.git", rev = "6929247e03cc8657cc3f6aabf210525f16237fd7" }
# Same fortnum as cmake/dependency_versions.json; libneo pins an older one.
fortnum = { git = "https://github.com/lazy-fortran/fortnum.git", rev = "d88d09c7a7b6c0c265b8c30c199d7f8f4219909c" }
openmp = "*"
hdf5 = "*"
netcdf = "*"
blas = "*"

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false

[install]
library = true

[fortran]
implicit-typing = true
implicit-external = true
source-form = "free"
