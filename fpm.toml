name = "SIMPLE"
version = "1.5.1"
license = "MIT"
author = "Christopher Albert"
maintainer = "albert@tugraz.at"
copyright = "Copyright 2025, Plasma Physics at TU Graz"

[dependencies]
libneo.git = "https://github.com/itpplasma/libneo.git"
# Same fortnum as cmake/dependency_versions.json; libneo pins an older one.
fortnum = { git = "https://github.com/lazy-fortran/fortnum.git", rev = "6655e69ceda762ab880ad41efc5582433b8a24a0" }
openmp = "*"
hdf5 = "*"
netcdf = "*"
blas = "*"

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false

[install]
library = true

[fortran]
implicit-typing = true
implicit-external = true
source-form = "free"
