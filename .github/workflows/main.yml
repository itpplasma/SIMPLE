name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      libneo_ref:
        description: libneo branch, tag or commit to build against
        required: false
        default: ''
      experimental_compilers:
        description: run non-blocking Intel ifx and LLVM flang smoke tests
        type: boolean
        required: false
        default: false
      full:
        description: run the full suite (fast + slow + regression); set by the libneo full-ci gate
        required: false
        default: 'false'
      verification_report:
        description: build and upload the bounded EUROfusion verification report
        required: false
        default: 'false'
      runner:
        description: where Build and Test runs (itp-slurm = sCluster via self-hosted dispatch)
        type: choice
        options: [itp-slurm, hosted]
        required: false
        default: itp-slurm

# A new push to a pull request cancels its running checks (and Slurm jobs).
# A label event never cancels a run: full-ci gets its own group, and other
# labels do not start Build and Test (see its if:).
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-${{
    github.event.action == 'labeled' && github.event.label.name == 'full-ci' && 'full' || 'std' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
  actions: read

jobs:
  changed-line-lint:
    permissions:
      contents: read
    name: Changed-line lint
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: python -m pip install fprettify==0.3.7 ruff==0.14.1

      - name: Test the changed-line checker
        run: python -m unittest discover -s test/python -p test_changed_line_lint.py -v

      - name: Check changed lines
        run: >-
          python tools/check_changed_lines.py
          --base "${{ github.event.pull_request.base.sha }}"

  # Pushes and same-repository PRs run on the itp-slurm runners, which pack an
  # offline bundle and run ci/run.sh in a Slurm job on sCluster. Fork PRs (and
  # workflow_dispatch with runner=hosted) use the GitHub-hosted steps below.
  test:
    name: Build and Test
    runs-on: >-
      ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) ||
      inputs.runner == 'hosted') && 'ubuntu-24.04' || fromJSON('["self-hosted","itp-slurm"]') }}
    timeout-minutes: 150
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
    env:
      CI_HOSTED: >-
        ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) ||
        inputs.runner == 'hosted') && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build and test on sCluster
        if: env.CI_HOSTED != 'true'
        env:
          EVENT: ${{ github.event_name }}
          FULL_INPUT: ${{ inputs.full }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          SCI_HEAD_REF: ${{ github.head_ref || github.ref_name }}
          SCI_LIBNEO_REF: ${{ inputs.libneo_ref }}
        run: |
          case $EVENT in
          workflow_dispatch) [ "$FULL_INPUT" = true ] && tier=full || tier=smoke ;;
          pull_request)
            if [ "$BASE_REF" = "$DEFAULT_BRANCH" ] || [ "$FULL_LABEL" = true ]; then
              tier=full
            else
              tier=fast
            fi
            changed=$(git diff --name-only "$BASE_SHA" HEAD)
            if ! grep -qvE '^(DOC|docs)/|\.(md|rst)$' <<< "$changed"; then
              echo "Documentation-only change; nothing to build."
              exit 0
            fi
            ;;
          *) tier=full ;;
          esac
          echo "tier: $tier"
          export TMPDIR=$RUNNER_TEMP
          ci/bundle.sh "$RUNNER_TEMP/bundle.tar.zst"
          sci-dispatch "$tier" "$RUNNER_TEMP/bundle.tar.zst"

      - name: Set up Python
        if: env.CI_HOSTED == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        if: env.CI_HOSTED == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran \
            git-lfs \
            cmake \
            ninja-build \
            pkg-config \
            libgsl-dev \
            libhdf5-dev \
            libfftw3-dev \
            libnetcdf-dev \
            libnetcdff-dev \
            libopenblas-dev \
            liblapack-dev \
            openmpi-bin \
            libopenmpi-dev

      - name: Install Python dependencies
        if: env.CI_HOSTED == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Fetch Cached GVEC QA Data
        if: env.CI_HOSTED == 'true'
        env:
          GITLAB_ACCESS_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
          SIMPLE_GVEC_QA_CACHE_ROOT: ${{ github.workspace }}/.ci-data/gvec_qa_roundtrip
        run: |
          if [ -n "${GITLAB_ACCESS_TOKEN:-}" ]; then
            make gvec-qa-cache-fetch
          else
            echo "GITLAB_ACCESS_TOKEN is not set; skipping GVEC QA cache fetch"
          fi

      - name: Build SIMPLE (deterministic FP for reproducibility)
        if: env.CI_HOSTED == 'true'
        run: |
          make clean
          REF="${{ inputs.libneo_ref }}"
          if [ -n "$REF" ]; then
            make build-deterministic LIBNEO_REF="$REF"
          else
            make build-deterministic
          fi

      # libneo-gate dispatch (no full) runs only the sub-minute smoke set;
      # push, PR and full=true run the complete suite below.
      - name: Run Smoke Tests (libneo gate)
        if: env.CI_HOSTED == 'true' && (github.event_name == 'workflow_dispatch' && inputs.full != 'true')
        run: make test-smoke

      - name: Run Fast Tests (Fortran only)
        if: env.CI_HOSTED == 'true' && (github.event_name != 'workflow_dispatch' || inputs.full == 'true')
        run: make test-fast

      - name: Install Python package
        if: env.CI_HOSTED == 'true' && (github.event_name != 'workflow_dispatch' || inputs.full == 'true')
        run: python -m pip install -e '.[imas]' --no-build-isolation -Ccmake.define.SIMPLE_DETERMINISTIC_FP=ON

      # Full tier: skipped on upper layers of a PR stack (base is not main)
      # unless the PR is labeled full-ci.
      - name: Run Slow Tests (Python)
        if: >-
          env.CI_HOSTED == 'true' &&
          ((github.event_name != 'workflow_dispatch' || inputs.full == 'true') &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.base.ref == github.event.repository.default_branch ||
          contains(github.event.pull_request.labels.*.name, 'full-ci')))
        env:
          SIMPLE_GVEC_QA_CACHE_ROOT: ${{ github.workspace }}/.ci-data/gvec_qa_roundtrip
        run: make test-slow

      - name: Run Regression Tests (Golden Record)
        if: >-
          env.CI_HOSTED == 'true' &&
          ((github.event_name != 'workflow_dispatch' || inputs.full == 'true') &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.base.ref == github.event.repository.default_branch ||
          contains(github.event.pull_request.labels.*.name, 'full-ci')))
        run: make test-regression

      - name: Upload test results
        if: always() && env.CI_HOSTED == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: |
            build/test/Testing/
            build/test/tests/golden_record/runs/**/simple.in
            build/test/tests/golden_record/runs/**/start.dat
            build/test/tests/golden_record/runs/**/times_lost.dat
            build/test/tests/golden_record/runs/**/orbit_exit_code.dat

  gcc-matrix:
    permissions:
      contents: read
    name: GCC ${{ matrix.gcc }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: >-
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.full == 'true') ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.base.ref == github.event.repository.default_branch ||
      contains(github.event.pull_request.labels.*.name, 'full-ci'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - gcc: 13
            coverage: 'OFF'
          - gcc: 14
            coverage: 'ON'
    env:
      CC: gcc-${{ matrix.gcc }}
      CXX: g++-${{ matrix.gcc }}
      FC: gfortran-${{ matrix.gcc }}
      OMP_NUM_THREADS: 2
      # Fast-suite spline fixtures each exceed 10 GiB on 16 GiB hosted runners.
      CTEST_PARALLEL_LEVEL: ${{ matrix.coverage == 'ON' && '1' || '2' }}
      # Keep PR additions small; collect full coverage on main/full dispatch.
      COVERAGE: ${{ matrix.coverage == 'ON' && github.event_name != 'pull_request' && 'ON' || 'OFF' }}
      TEST_TARGET: ${{ matrix.coverage == 'ON' && github.event_name != 'pull_request' && 'test-fast' || 'test-smoke' }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install GCC toolchain and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-${{ matrix.gcc }} g++-${{ matrix.gcc }} gfortran-${{ matrix.gcc }} \
            git-lfs cmake ninja-build pkg-config lcov \
            libgsl-dev libhdf5-dev libfftw3-dev libnetcdf-dev libnetcdff-dev \
            libopenblas-dev liblapack-dev openmpi-bin libopenmpi-dev
          python -m pip install numpy netCDF4
          if [ "$COVERAGE" = 'ON' ]; then
            python -m pip install gcovr==8.4
          fi

      - name: Build and run tests
        env:
          LIBNEO_INPUT_REF: ${{ inputs.libneo_ref }}
          FLAGS: >-
            -DENABLE_COVERAGE=${{ env.COVERAGE }}
            -DENABLE_PYTHON_INTERFACE=OFF -DSIMPLE_ENABLE_PYTHON_TOOLS=OFF
        run: |
          make "$TEST_TARGET" CONFIG=Fast \
            LIBNEO_REF="$LIBNEO_INPUT_REF"

      - name: Generate coverage report and summary
        if: env.COVERAGE == 'ON' && !cancelled()
        run: |
          gcovr --root . --filter 'src/|app/' --include-internal-functions \
            --gcov-executable gcov-${{ matrix.gcc }} \
            --xml-pretty --xml build/coverage.xml \
            --html-details build/coverage.html --print-summary build \
            > build/coverage-summary.txt
          {
            echo '## Fast-suite coverage (GCC ${{ matrix.gcc }})'
            echo '```text'
            cat build/coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: env.COVERAGE == 'ON' && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: fast-suite-coverage
          if-no-files-found: error
          path: build/coverage*

  intel-ifx:
    permissions:
      contents: read
    name: Intel ifx smoke tests (non-blocking)
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && inputs.experimental_compilers
    continue-on-error: true
    timeout-minutes: 30
    container:
      image: intel/oneapi-hpckit:latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git make python3-venv \
            cmake \
            ninja-build \
            pkg-config \
            libgsl-dev \
            libhdf5-dev \
            libfftw3-dev \
            libnetcdf-dev \
            libnetcdff-dev \
            libopenblas-dev \
            liblapack-dev \
            openmpi-bin \
            libopenmpi-dev

      - name: Build and run smoke tests with ifx
        shell: bash
        run: |
          source /opt/intel/oneapi/setvars.sh
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install numpy
          make clean
          make test-smoke CONFIG=Fast \
            FLAGS='-DSIMPLE_DETERMINISTIC_FP=OFF -DCMAKE_Fortran_COMPILER=ifx -DCMAKE_C_COMPILER=icx -DENABLE_PYTHON_INTERFACE=OFF -DSIMPLE_ENABLE_PYTHON_TOOLS=OFF'

  llvm-flang:
    permissions:
      contents: read
    name: LLVM flang smoke tests (non-blocking)
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && inputs.experimental_compilers
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install LLVM flang and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flang-18 libomp-18-dev \
            clang-18 \
            cmake \
            ninja-build \
            pkg-config \
            libgsl-dev \
            libhdf5-dev \
            libfftw3-dev \
            libnetcdf-dev \
            libnetcdff-dev \
            libopenblas-dev \
            liblapack-dev \
            openmpi-bin \
            libopenmpi-dev

      - name: Build and run smoke tests with LLVM flang
        run: |
          python -m pip install numpy netCDF4
          make clean
          make test-smoke CONFIG=Fast \
            FLAGS='-DSIMPLE_DETERMINISTIC_FP=OFF -DCMAKE_Fortran_COMPILER=flang-new-18 -DCMAKE_C_COMPILER=clang-18 -DENABLE_PYTHON_INTERFACE=OFF -DSIMPLE_ENABLE_PYTHON_TOOLS=OFF'

  cgal-wall:
    name: CGAL Wall Unit Tests
    runs-on: ubuntu-24.04
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request'

    timeout-minutes: 20
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 8
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies (CGAL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran \
            cmake \
            ninja-build \
            pkg-config \
            libgsl-dev \
            libhdf5-dev \
            libfftw3-dev \
            libcgal-dev \
            libboost-dev \
            libgmp-dev \
            libmpfr-dev \
            libnetcdf-dev \
            libnetcdff-dev \
            libopenblas-dev \
            liblapack-dev \
            libopenmpi-dev \
            openmpi-bin

      - name: Install wall-test Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.2.6' 'scipy==1.16.3' netCDF4 shapely pytest vtk f90wrap==0.3.0 \
            'git+https://github.com/itpplasma/map2disc.git@14da2f094ab2505a639b9cd04af57f5c0dbfaa54'

      - name: Run CGAL Wall Tests
        run: |
          make clean
          # Full-torus cylindrical chartmaps (itpplasma/libneo#429) and the regular
          # near-axis Boozer field (itpplasma/libneo#437).
          REF="${{ inputs.libneo_ref || '924ba7735366d95c2c6855bf00bd0e46b8c05cf2' }}"
          make test CONFIG=Fast \
            FLAGS="-DSIMPLE_ENABLE_CGAL=ON -DENABLE_PYTHON_INTERFACE=ON -DSIMPLE_ENABLE_PYTHON_TOOLS=ON -DLIBNEO_REF=$REF" \
            TEST='test_chartmap_metadata|test_stl_wall_intersection|test_collisional_stl_wall|test_triangle_heat_load|test_profiles' VERBOSE=1
          # A missing Python interface must not silently omit the integration test.
          ctest --test-dir build/test -N -R '^test_triangle_heat_load$' | grep 'Test.*test_triangle_heat_load'

      - name: Upload wall-test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cgal-wall-results
          path: |
            build/test/Testing/
            build/test/tests/collisional_stl_wall/

  vmecpp:
    name: VMEC++ Direct Geometry
    runs-on: ubuntu-24.04
    if: >-
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.base.ref == github.event.repository.default_branch ||
      contains(github.event.pull_request.labels.*.name, 'full-ci'))

    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran \
            g++ \
            git-lfs \
            cmake \
            ninja-build \
            pkg-config \
            zlib1g-dev \
            libgsl-dev \
            libhdf5-dev \
            libfftw3-dev \
            libnetcdf-dev \
            libnetcdff-dev \
            libopenblas-dev \
            liblapack-dev \
            openmpi-bin \
            libopenmpi-dev

      - name: Configure SIMPLE with VMEC++
        run: |
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DSIMPLE_ENABLE_VMECPP=ON

      - name: Build SIMPLE with VMEC++
        run: cmake --build build --config Release

      - name: Run VMEC++ tests
        run: ctest --test-dir build/test -R vmecpp --output-on-failure

  build-docs:
    name: Build Documentation
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            lyx \
            texlive-latex-extra \
            texlive-publishers \
            texlive-science

      - name: Build LaTeX documents
        run: |
          cd DOC
          latexmk -pdf canonical_and_boozer_flux_coords_via_VMEC.tex
          lyx --export pdf2 neo-orb.lyx

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v6
        with:
          name: documentation
          path: |
            DOC/canonical_and_boozer_flux_coords_via_VMEC.pdf
            DOC/neo-orb.pdf

  verification-report:
    name: Generate Verification Report
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch' && inputs.verification_report == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran git-lfs cmake ninja-build pkg-config \
            libgsl-dev libhdf5-dev libfftw3-dev libnetcdf-dev \
            libnetcdff-dev libopenblas-dev liblapack-dev

      - name: Install report dependencies
        run: python -m pip install numpy matplotlib netCDF4 scipy pytest

      - name: Build deterministic SIMPLE
        run: make build-deterministic CONFIG=Fast FLAGS='-DENABLE_PYTHON_INTERFACE=OFF'

      - name: Test report helpers
        run: make test CONFIG=Fast TEST='^test_verification_report$$'

      - name: Generate report
        run: python tools/generate_verification_report.py

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-report
          path: build/output/verification-report/
