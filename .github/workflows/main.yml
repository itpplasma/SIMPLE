name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      libneo_ref:
        description: libneo branch, tag or commit to build against
        required: false
        default: ''
      full:
        description: run the full suite (fast + slow + regression); set by the libneo full-ci gate
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
  actions: read

jobs:
  changed-line-lint:
    permissions:
      contents: read
    name: Changed-line lint
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: python -m pip install fprettify==0.3.7 ruff==0.14.1

      - name: Test the changed-line checker
        run: python -m unittest discover -s test/python -p test_changed_line_lint.py -v

      - name: Check changed lines
        run: >-
          python tools/check_changed_lines.py
          --base "${{ github.event.pull_request.base.sha }}"

  test:
    name: Build and Test
    runs-on: ubuntu-24.04
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran \
            git-lfs \
            cmake \
            ninja-build \
            pkg-config \
            libgsl-dev \
            libhdf5-dev \
            libfftw3-dev \
            libnetcdf-dev \
            libnetcdff-dev \
            libopenblas-dev \
            liblapack-dev \
            openmpi-bin \
            libopenmpi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Fetch Cached GVEC QA Data
        env:
          GITLAB_ACCESS_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
          SIMPLE_GVEC_QA_CACHE_ROOT: ${{ github.workspace }}/.ci-data/gvec_qa_roundtrip
        run: |
          if [ -n "${GITLAB_ACCESS_TOKEN:-}" ]; then
            make gvec-qa-cache-fetch
          else
            echo "GITLAB_ACCESS_TOKEN is not set; skipping GVEC QA cache fetch"
          fi

      - name: Build SIMPLE (deterministic FP for reproducibility)
        run: |
          make clean
          REF="${{ inputs.libneo_ref }}"
          if [ -n "$REF" ]; then
            make build-deterministic LIBNEO_REF="$REF"
          else
            make build-deterministic
          fi

      # libneo-gate dispatch (no full) runs only the sub-minute smoke set;
      # push, PR and full=true run the complete suite below.
      - name: Run Smoke Tests (libneo gate)
        if: github.event_name == 'workflow_dispatch' && inputs.full != 'true'
        run: make test-smoke

      - name: Run Fast Tests (Fortran only)
        if: github.event_name != 'workflow_dispatch' || inputs.full == 'true'
        run: make test-fast

      - name: Install Python package
        if: github.event_name != 'workflow_dispatch' || inputs.full == 'true'
        run: python -m pip install -e . --no-build-isolation -Ccmake.define.SIMPLE_DETERMINISTIC_FP=ON

      - name: Run Slow Tests (Python)
        if: github.event_name != 'workflow_dispatch' || inputs.full == 'true'
        env:
          SIMPLE_GVEC_QA_CACHE_ROOT: ${{ github.workspace }}/.ci-data/gvec_qa_roundtrip
        run: make test-slow

      - name: Run Regression Tests (Golden Record)
        if: github.event_name != 'workflow_dispatch' || inputs.full == 'true'
        run: make test-regression

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: |
            build/Testing/

  gcc-matrix:
    permissions:
      contents: read
    name: GCC ${{ matrix.gcc }} / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.full == 'true') ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    strategy:
      fail-fast: false
      matrix:
        include:
          - gcc: 13
            config: Fast
            target: test-smoke
            coverage: 'OFF'
          - gcc: 14
            config: Debug
            target: test-fast
            coverage: 'ON'
    env:
      CC: gcc-${{ matrix.gcc }}
      CXX: g++-${{ matrix.gcc }}
      FC: gfortran-${{ matrix.gcc }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install GCC toolchain and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-${{ matrix.gcc }} g++-${{ matrix.gcc }} gfortran-${{ matrix.gcc }} \
            git-lfs cmake ninja-build pkg-config lcov \
            libgsl-dev libhdf5-dev libfftw3-dev libnetcdf-dev libnetcdff-dev \
            libopenblas-dev liblapack-dev openmpi-bin libopenmpi-dev
          python -m pip install numpy netCDF4

      - name: Build and run tests
        env:
          LIBNEO_INPUT_REF: ${{ inputs.libneo_ref }}
          FLAGS: >-
            -DENABLE_COVERAGE=${{ matrix.coverage }}
            -DENABLE_PYTHON_INTERFACE=OFF -DSIMPLE_ENABLE_PYTHON_TOOLS=OFF
        run: |
          make ${{ matrix.target }} CONFIG=${{ matrix.config }} \
            LIBNEO_REF="$LIBNEO_INPUT_REF"

      - name: Generate coverage report and summary
        if: matrix.coverage == 'ON' && !cancelled()
        run: |
          cmake --build build --target coverage
          {
            echo '## Fast-suite coverage (GCC ${{ matrix.gcc }})'
            echo '```text'
            lcov --summary build/coverage_filtered.info
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: matrix.coverage == 'ON' && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: fast-suite-coverage
          if-no-files-found: error
          path: |
            build/coverage.info
            build/coverage_filtered.info

  intel-ifx:
    permissions:
      contents: read
    name: Intel ifx smoke tests (non-blocking)
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    timeout-minutes: 30
    container:
      image: intel/oneapi-hpckit:latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git make python3-pip \
            cmake \
            ninja-build \
            pkg-config \
            libgsl-dev \
            libhdf5-dev \
            libfftw3-dev \
            libnetcdf-dev \
            libnetcdff-dev \
            libopenblas-dev \
            liblapack-dev \
            openmpi-bin \
            libopenmpi-dev

      - name: Build and run smoke tests with ifx
        shell: bash
        run: |
          source /opt/intel/oneapi/setvars.sh
          python3 -m pip install --break-system-packages numpy
          make clean
          make test-smoke CONFIG=Fast \
            FLAGS='-DSIMPLE_DETERMINISTIC_FP=OFF -DCMAKE_Fortran_COMPILER=ifx -DCMAKE_C_COMPILER=icx -DENABLE_PYTHON_INTERFACE=OFF -DSIMPLE_ENABLE_PYTHON_TOOLS=OFF'

  llvm-flang:
    permissions:
      contents: read
    name: LLVM flang smoke tests (non-blocking)
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install LLVM flang and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flang-18 libomp-18-dev \
            clang-18 \
            cmake \
            ninja-build \
            pkg-config \
            libgsl-dev \
            libhdf5-dev \
            libfftw3-dev \
            libnetcdf-dev \
            libnetcdff-dev \
            libopenblas-dev \
            liblapack-dev \
            openmpi-bin \
            libopenmpi-dev

      - name: Build and run smoke tests with LLVM flang
        run: |
          python -m pip install numpy netCDF4
          make clean
          make test-smoke CONFIG=Fast \
            FLAGS='-DSIMPLE_DETERMINISTIC_FP=OFF -DCMAKE_Fortran_COMPILER=flang-new-18 -DCMAKE_C_COMPILER=clang-18 -DENABLE_PYTHON_INTERFACE=OFF -DSIMPLE_ENABLE_PYTHON_TOOLS=OFF'

  cgal-wall:
    name: CGAL Wall Unit Tests
    runs-on: ubuntu-24.04
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies (CGAL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran \
            cmake \
            ninja-build \
            pkg-config \
            libgsl-dev \
            libhdf5-dev \
            libfftw3-dev \
            libcgal-dev \
            libboost-dev \
            libgmp-dev \
            libmpfr-dev \
            libnetcdf-dev \
            libnetcdff-dev \
            libopenblas-dev \
            liblapack-dev \
            libopenmpi-dev \
            openmpi-bin

      - name: Install minimal Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy netCDF4

      - name: Run CGAL Wall Unit Tests (CGAL enabled, minimal)
        run: |
          make clean
          REF="${{ inputs.libneo_ref }}"
          LIBNEO_ARG=""
          if [ -n "$REF" ]; then LIBNEO_ARG="LIBNEO_REF=$REF"; fi
          make test-fast CONFIG=Fast \
            FLAGS='-DSIMPLE_ENABLE_CGAL=ON -DENABLE_PYTHON_INTERFACE=OFF -DSIMPLE_ENABLE_PYTHON_TOOLS=OFF' \
            TEST='test_chartmap_metadata|test_stl_wall_intersection' \
            $LIBNEO_ARG

  build-docs:
    name: Build Documentation
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            lyx \
            texlive-latex-extra \
            texlive-publishers \
            texlive-science

      - name: Build LaTeX documents
        run: |
          cd DOC
          latexmk -pdf canonical_and_boozer_flux_coords_via_VMEC.tex
          lyx --export pdf2 neo-orb.lyx

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v6
        with:
          name: documentation
          path: |
            DOC/canonical_and_boozer_flux_coords_via_VMEC.pdf
            DOC/neo-orb.pdf
