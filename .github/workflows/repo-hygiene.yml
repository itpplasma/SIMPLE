name: Repository hygiene
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
# Only PR runs share a group; pending push and merge-group runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo-hygiene:
    uses: itpplasma/.github/.github/workflows/repo-hygiene.yml@dd4e7ef8217afa34e70efe4dc6a9289f6b5176b2
    with:
      hygiene-revision: dd4e7ef8217afa34e70efe4dc6a9289f6b5176b2
