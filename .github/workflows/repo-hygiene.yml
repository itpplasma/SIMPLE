name: Repository hygiene
on:
  pull_request:
  merge_group:
permissions:
  contents: read
# Only PR runs share a group; pending push and merge-group runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo-hygiene:
    uses: lazy-fortran/.github/.github/workflows/repo-hygiene.yml@4a515a95feac1fa1e79d2f721a4b20eb124b20f4
    with:
      hygiene-revision: 4a515a95feac1fa1e79d2f721a4b20eb124b20f4
